name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache
      - name: Install Buildozer (latest)
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/kivy/buildozer.git" "cython==0.29.36" setuptools virtualenv
      - name: Build APK
        run: |
          grep -q accept_sdk_license buildozer.spec || sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
          yes | buildozer -v android debug
      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" bin/*.apk \
            --title "APK build ${{ github.run_number }}" --notes "Built by APK Cloud Builder"
