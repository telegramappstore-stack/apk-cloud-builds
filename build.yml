name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip build-essential ccache autoconf automake libtool libltdl-dev \
            pkg-config cmake zlib1g-dev libncurses-dev libffi-dev libssl-dev libsqlite3-dev

      - name: Python tools (pinned)
        run: pip install "buildozer==1.5.0" "cython<3" virtualenv setuptools wheel

      # ---- VPN native part: hev-socks5-tunnel (tun -> SOCKS5). Optional: if this step fails the APK is still built
      # (VPN then falls back to "HTTP proxy mode": browsers only).
      - name: Build tun2socks library (NDK)
        id: hev
        continue-on-error: true
        run: |
          mkdir -p libs/arm64-v8a libs/armeabi-v7a
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          mkdir -p /tmp/hev/jni && cd /tmp/hev
          echo 'include $(call all-subdir-makefiles)' > jni/Android.mk
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel jni/hev-socks5-tunnel
          "$NDK/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk \
            APP_ABI="arm64-v8a armeabi-v7a" APP_PLATFORM=android-24 NDK_LIBS_OUT=./libs NDK_OUT=./obj
          for a in arm64-v8a armeabi-v7a; do cp "libs/$a/libhev-socks5-tunnel.so" "$GITHUB_WORKSPACE/libs/$a/"; done
          ls -l "$GITHUB_WORKSPACE"/libs/*

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        run: |
          set -o pipefail
          mkdir -p libs/arm64-v8a libs/armeabi-v7a
          buildozer -v android debug 2>&1 | tee build.log

      # the real error is hidden between thousands of progress dots: show only meaningful lines
      - name: Show errors
        if: failure()
        run: |
          echo "===== error lines ====="
          grep -vE '^\.+$' build.log | grep -nEi "error|failed|exception|not found|no such|cannot|traceback|requirement" | tail -60 || true
          echo "===== last 150 lines ====="
          grep -vE '^\.+$' build.log | tail -150

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetFree-apk
          path: bin/*.apk

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
